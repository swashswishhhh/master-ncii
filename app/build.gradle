plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services' // This links the google-services.json
}

android {
    namespace 'com.example.servermasterncii'
    compileSdk 34 // Changed from 36 to 34 for stability in 2026

    defaultConfig {
        applicationId "com.example.servermasterncii"
        minSdk 24
        targetSdk 34 // Matches compileSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Updated for modern Firebase/Room
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // --- Core Libraries ---
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // --- Room Database (For Offline-First logic) ---
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // --- UI Enhancements ---
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // --- ViewModel + LiveData (Critical for your Login/Admin logic) ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // --- Firebase Ecosystem ---
    // The BOM ensures all Firebase libs (Auth, Firestore) are compatible
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    implementation 'com.google.firebase:firebase-analytics'

    // --- Social Authentication ---
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.facebook.android:facebook-login:17.0.0' // Updated to stable 17

    // --- Testing ---
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}